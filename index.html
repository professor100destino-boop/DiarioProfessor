<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2a55"><title>Professor Control</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head>
<body style="font-family:system-ui;background:#eef3fb;color:#152235;display:grid;place-items:center;min-height:100vh;margin:0">
<div id="loading">Abrindo Professor Control…</div>
<script>
(async()=>{try{
const parts=["./parts/part00.txt", "./parts/part01.txt", "./parts/part02.txt", "./parts/part03.txt", "./parts/part04.txt", "./parts/part05.txt", "./parts/part06.txt", "./parts/part07.txt", "./parts/part08.txt", "./parts/part09.txt", "./parts/part10.txt", "./parts/part11.txt"];
const texts=await Promise.all(parts.map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.text()})));
const app=texts.join('');
const patch="\n<script src=\"https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js\"></script>\n<style>\n.attendance-student-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}\n.btn-inactivate{border:1px solid #f59e0b;background:#fff7ed;color:#9a3412;border-radius:12px;padding:8px 12px;font-weight:800}\n.attendance-bottom-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:22px 0 8px;padding:18px;background:#fff;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-soft)}\n.attendance-bottom-actions button{min-width:210px}\n.btn-pdf{background:linear-gradient(135deg,#7c3aed,#9333ea);color:#fff;border:0;border-radius:14px;padding:13px 18px;font-weight:900}\n.inactive-box{margin-top:14px;padding:14px;border:1px dashed #f59e0b;border-radius:16px;background:#fffaf0}\n.inactive-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f7df9d}\n.inactive-row:last-child{border-bottom:0}\n</style>\n<script>\n(function(){\n  db.alunos=(db.alunos||[]).map(a=>({...a,ativo:a.ativo!==false,motivoInativo:a.motivoInativo||'',dataInativacao:a.dataInativacao||''}));\n  localStorage.setItem(KEY,JSON.stringify(db));\n  const bimSel=document.querySelector('#planBimestre');\n  if(bimSel){\n    bimSel.onchange=()=>renderPlanejamentos();\n    renderPlanejamentos=function(){\n      const list=$('#planejamentosList'); if(!list)return;\n      const tid=$('#planTurma')?.value||'';\n      const bim=$('#planBimestre')?.value||'3º Bimestre';\n      const plans=db.planejamentos.filter(p=>(!tid||p.turmaId===tid)&&((p.bimestre||'3º Bimestre')===bim));\n      if(!plans.length){list.innerHTML='<p class=muted style=\"margin-top:18px\">Nenhum planejamento importado para esta turma no '+bim+'.</p>';$('#planAulasArea')?.classList.add('hidden');return;}\n      list.innerHTML=plans.map(p=>{const t=db.turmas.find(x=>x.id===p.turmaId);return '<div class=\"plan-card\"><div class=\"plan-card-row\"><div><b>'+esc(p.nome||p.arquivo||'Planejamento')+'</b><br><small>'+esc(turmaNomeCompleto(t))+' • '+esc(p.bimestre||'3º Bimestre')+' • '+p.aulas.length+' aulas</small></div><div class=\"toolbar\"><button class=\"primary ghost\" onclick=\"abrirPlanejamento(\\\''+p.id+'\\\')\">Abrir aulas</button><button class=\"danger\" onclick=\"excluirPlanejamento(\\\''+p.id+'\\\')\">Excluir</button></div></div></div>';}).join('');\n    };\n  }\n  window.salvarChamadaAtual=function(){save();alert('Chamada salva com sucesso.');};\n  window.desativarAlunoChamada=function(aid){\n    const a=db.alunos.find(x=>x.id===aid); if(!a)return;\n    const escolha=prompt('Desativar aluno: '+a.nome+'\\n\\nDigite o número do motivo:\\n1 - Transferência\\n2 - Parou de estudar\\n3 - Mudou de turma\\n4 - Outro');\n    if(escolha===null)return;\n    const motivos=['Transferência','Parou de estudar','Mudou de turma','Outro']; const idx=Number(escolha)-1;\n    if(idx<0||idx>=motivos.length){alert('Opção inválida.');return}\n    let motivo=motivos[idx],detalhe='';\n    if(motivo==='Mudou de turma'){const atuais=db.turmas.filter(t=>t.id!==a.turmaId);if(atuais.length){const opcoes=atuais.map((t,i)=>(i+1)+' - '+turmaNomeCompleto(t)).join('\\n');const dest=prompt('Para qual turma o aluno mudou?\\n\\n'+opcoes+'\\n\\nDigite o número ou deixe em branco para apenas desativar.');if(dest&&Number(dest)>=1&&Number(dest)<=atuais.length)detalhe='Mudou para '+turmaNomeCompleto(atuais[Number(dest)-1]);}}\n    else if(motivo==='Outro'){detalhe=prompt('Informe o motivo da desativação:')||'Outro';}\n    if(!confirm('Confirmar desativação de '+a.nome+'?\\nMotivo: '+(detalhe||motivo)))return;\n    const senha=prompt('Digite a senha do Professor Control para confirmar:');if(senha===null)return;if(!securityCheckPassword(senha)){alert('Senha incorreta. O aluno não foi desativado.');return}\n    a.ativo=false;a.motivoInativo=detalhe||motivo;a.dataInativacao=new Date().toISOString();save();renderFreq();alert('Aluno desativado com sucesso.');\n  };\n  window.reativarAluno=function(aid){const a=db.alunos.find(x=>x.id===aid);if(!a)return;const senha=prompt('Digite a senha para reativar '+a.nome+':');if(senha===null)return;if(!securityCheckPassword(senha)){alert('Senha incorreta.');return}a.ativo=true;a.motivoInativo='';a.dataInativacao='';save();renderFreq();alert('Aluno reativado com sucesso.');};\n  renderFreq=function(){\n    const box=$('#freqList');if(!box)return;const tid=$('#freqTurma')?.value||'';const date=$('#freqData')?.value||new Date().toISOString().slice(0,10);\n    const ativos=db.alunos.filter(a=>a.turmaId===tid&&a.ativo!==false).sort((a,b)=>(Number(a.numero)||999)-(Number(b.numero)||999)||a.nome.localeCompare(b.nome));\n    const inativos=db.alunos.filter(a=>a.turmaId===tid&&a.ativo===false).sort((a,b)=>(Number(a.numero)||999)-(Number(b.numero)||999)||a.nome.localeCompare(b.nome));\n    if(!ativos.length&&!inativos.length){box.innerHTML='<p class=muted>Nenhum aluno nesta turma.</p>';return}\n    const getStatus=aid=>{const f=db.frequencias.find(x=>x.alunoId===aid&&x.turmaId===tid&&x.data===date);return f?.status||'Presente'};\n    let h=ativos.map(a=>{const s=getStatus(a.id);return '<div class=\"freq-row\"><div style=\"min-width:280px\"><b>'+esc(a.numero||'')+' '+esc(a.nome)+'</b><div class=\"attendance-student-actions\"><button class=\"btn-inactivate\" onclick=\"desativarAlunoChamada(\\\''+a.id+'\\\')\">Desativar aluno</button></div></div><div class=\"seg\">'+['Presente','Falta','Justificada','Atraso'].map(st=>'<button class=\"'+(s===st?'active':'')+'\" onclick=\"setFreq(\\\''+a.id+'\\\',\\\''+st+'\\\')\">'+st+'</button>').join('')+'</div></div>';}).join('');\n    h+='<div class=\"attendance-bottom-actions\"><button class=\"primary\" onclick=\"salvarChamadaAtual()\">Salvar chamada</button><button class=\"btn-pdf\" onclick=\"gerarRelatorioFaltososPDF()\">Gerar PDF dos faltosos</button></div>';\n    if(inativos.length){h+='<div class=\"inactive-box\"><b>Alunos desativados nesta turma</b>'+inativos.map(a=>'<div class=\"inactive-row\"><div><b>'+esc(a.nome)+'</b><br><small>'+esc(a.motivoInativo||'Sem motivo informado')+'</small></div><button class=\"primary ghost\" onclick=\"reativarAluno(\\\''+a.id+'\\\')\">Reativar</button></div>').join('')+'</div>';}\n    box.innerHTML=h;\n  };\n  window.gerarRelatorioFaltososPDF=async function(){\n    const tid=$('#freqTurma')?.value||'';const data=$('#freqData')?.value||new Date().toISOString().slice(0,10);if(!tid){alert('Selecione a turma.');return}\n    const t=db.turmas.find(x=>x.id===tid);const e=db.escolas.find(x=>x.id===t?.escolaId);\n    const faltosos=db.alunos.filter(a=>a.turmaId===tid&&a.ativo!==false).filter(a=>{const f=db.frequencias.find(x=>x.alunoId===a.id&&x.turmaId===tid&&x.data===data);return (f?.status||'Presente')==='Falta';}).sort((a,b)=>(Number(a.numero)||999)-(Number(b.numero)||999)||a.nome.localeCompare(b.nome));\n    if(!faltosos.length){alert('Não há alunos marcados com falta nesta chamada.');return}if(!window.jspdf?.jsPDF){alert('O gerador de PDF ainda está carregando. Aguarde alguns segundos e tente novamente.');return}\n    const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});const margem=16;let y=18;doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('RELATÓRIO DE ALUNOS FALTOSOS',margem,y);y+=10;doc.setFont('helvetica','normal');doc.setFontSize(11);doc.text('Escola: '+(e?.nome||''),margem,y);y+=6;doc.text('Turma: '+turmaNomeCompleto(t),margem,y);y+=6;const [ano,mes,dia]=data.split('-');doc.text('Data: '+dia+'/'+mes+'/'+ano,margem,y);y+=6;doc.text('Quantidade de faltosos: '+faltosos.length,margem,y);y+=10;doc.setFont('helvetica','bold');doc.text('Nº',margem,y);doc.text('Aluno',margem+14,y);y+=6;doc.line(margem,y-3,195,y-3);doc.setFont('helvetica','normal');faltosos.forEach((a,i)=>{if(y>278){doc.addPage();y=18}doc.text(String(a.numero||i+1),margem,y);const nome=doc.splitTextToSize(a.nome,155);doc.text(nome,margem+14,y);y+=Math.max(7,nome.length*5)});y+=5;if(y>275){doc.addPage();y=20}doc.setFontSize(9);doc.text('Gerado pelo Professor Control',margem,y);const filename='faltosos_'+(t?.nome||'turma').replace(/[^\\w-]+/g,'_')+'_'+data+'.pdf';const blob=doc.output('blob');const file=new File([blob],filename,{type:'application/pdf'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'Relatório de alunos faltosos',text:'Relatório de faltosos - '+turmaNomeCompleto(t)+' - '+dia+'/'+mes+'/'+ano,files:[file]});return}}catch(err){if(err?.name==='AbortError')return}doc.save(filename);alert('PDF gerado. Abra o arquivo e compartilhe pelo WhatsApp.');\n  };\n  renderFreq();\n})();\n</script>\n";
document.open();document.write(app.replace('</body>',patch+'</body>'));document.close();
}catch(e){document.getElementById('loading').innerHTML='<b>Não foi possível abrir o aplicativo.</b><br>Conecte à internet uma vez e atualize a página.';console.error(e)}})();
</script></body></html>
