<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizando Professor Control</title><style>body{font-family:system-ui;background:#eef3fb;color:#14213d;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:28px;border-radius:20px;max-width:520px;text-align:center;box-shadow:0 10px 35px #0002}h2{margin-top:0}.ok{color:#15803d}.err{color:#b91c1c}</style></head><body><div class="box"><h2>Atualizando Professor Control</h2><p id="msg">Removendo a versão antiga e buscando a versão mais recente…</p></div><script>(async()=>{const msg=document.getElementById('msg');try{sessionStorage.setItem('professor_control_session_ok','1');if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){try{await r.unregister()}catch(e){}}}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('professor-control-')).map(k=>caches.delete(k)))}msg.className='ok';msg.textContent='Atualização preparada. Abrindo a versão nova…';setTimeout(()=>location.replace('./?fresh='+Date.now()),900)}catch(e){console.error(e);msg.className='err';msg.textContent='Não foi possível limpar a versão antiga. Verifique a internet e tente novamente.'}})();</script></body></html>
