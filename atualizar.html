<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Professor Control - Atualização</title>
<style>
body{font-family:system-ui;background:#eef3fb;color:#14213d;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.box{background:#fff;padding:28px;border-radius:20px;max-width:560px;width:100%;text-align:center;box-shadow:0 10px 35px #0002}h2{margin-top:0;font-size:30px}.sub{color:#64748b;margin-bottom:24px}.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:17px 16px;margin:12px 0;font-size:19px;font-weight:800;text-decoration:none;cursor:pointer}.blue{background:#2563eb;color:#fff}.green{background:#15803d;color:#fff}.gray{background:#e8eef7;color:#17345f}.ok{color:#15803d;font-weight:700}.err{color:#b91c1c;font-weight:700}.ver{margin-top:20px;color:#64748b;font-size:14px}
</style>
</head>
<body>
<div class="box">
<h2>Professor Control</h2>
<p class="sub">Atualização e instalação</p>
<button class="btn blue" onclick="atualizar()">🔄 Atualizar Professor Control</button>
<a class="btn green" href="./apk/Docencia-Facil-SIAP.apk?v=103" download="Docencia-Facil-SIAP-v1.0.3.apk">⬇ Baixar APK 1.0.3</a>
<a class="btn gray" href="./">Abrir Professor Control</a>
<p id="msg"></p>
<div class="ver">APK integrado: Docência Fácil + SIAP Fácil 1.0.3</div>
</div>
<script>
async function atualizar(){
 const msg=document.getElementById('msg');
 try{
  msg.className='';msg.textContent='Removendo o cache antigo…';
  sessionStorage.setItem('professor_control_session_ok','1');
  if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){try{await r.unregister()}catch(e){}}}
  if('caches' in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('professor-control-')).map(k=>caches.delete(k)))}
  msg.className='ok';msg.textContent='Atualização preparada. Abrindo a versão nova…';
  setTimeout(()=>location.replace('./?fresh='+Date.now()),900);
 }catch(e){console.error(e);msg.className='err';msg.textContent='Não foi possível limpar a versão antiga. Verifique a internet e tente novamente.'}
}
</script>
</body>
</html>
