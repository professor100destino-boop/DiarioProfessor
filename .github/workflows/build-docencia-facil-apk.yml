name: Build Docencia Facil 2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - 'scripts/patch_backup_chooser.py'
      - 'scripts/patch_print_advertencias.py'
      - 'scripts/patch_app_lifecycle.py'
      - 'scripts/patch_siap_login.py'
      - 'scripts/regression_checks.py'
      - '.github/workflows/build-docencia-facil-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: docencia-facil-debug-keystore-v1
      - name: Add native backup location chooser
        run: python3 scripts/patch_backup_chooser.py
      - name: Add native advertencia printing
        run: python3 scripts/patch_print_advertencias.py
      - name: Keep app alive and add safe close
        run: python3 scripts/patch_app_lifecycle.py
      - name: Fix SIAP login confirmation
        run: python3 scripts/patch_siap_login.py
      - name: Check essential features before build
        run: python3 scripts/regression_checks.py
      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Docencia-Facil-2-SIAP-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK in repository
        run: |
          mkdir -p apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk apk/Docencia-Facil-2-SIAP.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Docencia-Facil-2-SIAP.apk
          git commit -m "Publica APK Docencia Facil 2 + SIAP" || exit 0
          git push
