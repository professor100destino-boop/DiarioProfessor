name: Build Docencia Facil V3 Estavel

on:
  workflow_dispatch:
  push:
    branches:
      - v3-estavel-frozen
    paths:
      - '.github/workflows/build-docencia-facil-apk.yml'
      - 'scripts/patch_v3_stable_build.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: docencia-facil-permanente-keystore-v1
      - name: Add native backup location chooser
        run: python3 scripts/patch_backup_chooser.py
      - name: Add native advertencia printing
        run: python3 scripts/patch_print_advertencias.py
      - name: Keep app alive and add safe close
        run: python3 scripts/patch_app_lifecycle.py
      - name: Keep legacy SIAP compatibility
        run: python3 scripts/patch_siap_login.py
      - name: Add permanent remote SIAP bridge
        run: python3 scripts/patch_remote_siap_permanent.py
      - name: Check stable V3 before build
        run: python3 scripts/regression_checks.py
      - name: Point APK only to frozen V3
        run: python3 scripts/patch_v3_stable_build.py
      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Docencia-Facil-V3-Estavel
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish V3 stable APK in branch
        run: |
          mkdir -p apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk apk/Docencia-Facil-V3-Estavel.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Docencia-Facil-V3-Estavel.apk
          git commit -m "[skip ci] Publica APK V3 estavel congelada" || exit 0
          git push
